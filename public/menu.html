    <script>
        let buffetData = [];
        let currentLang = "en";

        async function loadBuffetMenu() {
            try {
                const res = await fetch('/api/buffet?t=' + new Date().getTime());
                if (res.ok) {
                    buffetData = await res.json();
                    renderBuffet();
                    checkUrlParams();
                }
            } catch (err) {
                console.error("Failed to load buffet menu", err);
            }
        }

        
        let currentCategory = 'all';

        function renderBuffet() {
            renderFilters();
            renderGrid();
        }

        function renderFilters() {
            const filterContainer = document.getElementById('category-filter-bar');
            if (!filterContainer) return;
            
            let html = `<button class="filter-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterCategory('all')">All Dishes</button>`;
            
            buffetData.forEach(category => {
                if (category.id === 'services') return;
                const catTitle = category.title.en || category.title.th || category.title;
                const isActive = currentCategory === category.id ? 'active' : '';
                html += `<button class="filter-btn ${isActive}" onclick="filterCategory('${category.id}')">${catTitle}</button>`;
            });
            
            filterContainer.innerHTML = html;
        }

        window.filterCategory = function(catId) {
            currentCategory = catId;
            renderFilters();
            renderGrid();
            window.scrollTo({ top: document.getElementById('category-filter-bar').offsetTop - 100, behavior: 'smooth' });
        };

        
        window.searchMenu = function(query) {
            const searchTerm = query.toLowerCase().trim();
            // Sync both search bars
            const desktopSearch = document.getElementById('menu-search');
            const mobileSearch = document.getElementById('mobile-menu-search');
            if (desktopSearch && desktopSearch.value !== query) desktopSearch.value = query;
            if (mobileSearch && mobileSearch.value !== query) mobileSearch.value = query;
            
            if (searchTerm !== '') {
                currentCategory = 'search'; // special state
            } else if (currentCategory === 'search') {
                currentCategory = 'all';
            }
            renderFilters();
            renderGrid(searchTerm);
        };

        function renderGrid(searchTerm = '') {
            const container = document.getElementById('buffet-container');
            let html = '';
            let hasResults = false;

            buffetData.forEach(category => {
                if (category.id === 'services') return;
                if (currentCategory !== 'all' && currentCategory !== 'search' && category.id !== currentCategory) return;
                
                // Filter items by search term
                const filteredItems = category.items.filter(item => {
                    if (!searchTerm) return true;
                    return item.en.toLowerCase().includes(searchTerm) || (item.th && item.th.toLowerCase().includes(searchTerm));
                });
                
                if (filteredItems.length === 0) return;
                hasResults = true;
                
                const catTitle = category.title.en || category.title.th || category.title;
                
                html += `
                    <div class="mb-12" id="section-${category.id}">
                        <div class="flex items-center gap-4 mb-6 pb-2 border-b-2 border-gray-100">
                            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 font-prompt">${catTitle}</h2>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                `;

                filteredItems.forEach(item => {
                    const imgSrc = item.img === 'logo.png' ? 'logo.png' : (item.img.startsWith('http') ? item.img : `images/${item.img}`);
                    const unit = item.unit || 'Portion';
                    // Check if there is a hover image in data, otherwise use the same image but keep the zoom effect
                    const hasHoverImg = !!item.img_hover;
                    const hoverImgSrc = hasHoverImg ? (item.img_hover.startsWith('http') ? item.img_hover : `images/${item.img_hover}`) : imgSrc;
                    
                    html += `
                        
                        <div class="bg-white rounded-lg overflow-hidden flex flex-col relative group border border-gray-100 shadow-sm hover:shadow-md transition-shadow" id="card-${item.id}">
                            <div class="relative w-full aspect-square overflow-hidden bg-gray-50 rounded-t-lg group/img">
                                <!-- Primary Image -->
                                <img src="${imgSrc}" class="absolute inset-0 w-full h-full object-cover transition-all duration-500 ${hasHoverImg ? 'group-hover/img:opacity-0' : 'group-hover/img:scale-105'}" onerror="this.src='logo.png';">
                                <!-- Secondary Hover Image (Only visible on hover if it exists) -->
                                ${hasHoverImg ? `<img src="${hoverImgSrc}" class="absolute inset-0 w-full h-full object-cover transition-all duration-500 opacity-0 group-hover/img:opacity-100 group-hover/img:scale-105" onerror="this.src='logo.png';">` : ''}
                                <!-- Info Icon (Top Right) -->
                                <button onclick="showQRCode('${item.id}', '${item.en}', ${item.price})" class="absolute top-2 right-2 bg-white/80 backdrop-blur-sm text-gray-500 hover:text-dark-green w-8 h-8 rounded-full flex items-center justify-center shadow-sm transition-colors border border-gray-200">
                                    <i class="fas fa-info"></i>
                                </button>
                            </div>
                            
                            <div class="p-4 flex flex-col flex-1">
                                <h3 class="font-bold text-gray-800 text-[16px] mb-2 leading-snug">${item.en}</h3>
                                
                                <!-- Dietary Icons (Placeholder) -->
                                <div class="flex gap-1.5 mb-4 text-gray-400 text-xs">
                                    <span class="border border-gray-300 rounded-full w-5 h-5 flex items-center justify-center" title="Gluten Free">GF</span>
                                    <span class="border border-gray-300 rounded-full w-5 h-5 flex items-center justify-center" title="Dairy Free">DF</span>
                                </div>
                                
                                <div class="mt-auto">
                                    <div class="flex justify-between border-t border-gray-100 pt-3 relative">
                                        <!-- Vertical divider -->
                                        <div class="absolute left-1/2 top-3 bottom-0 w-px bg-gray-100 -translate-x-1/2"></div>
                                        
                                        <!-- Serves 1 Column -->
                                        <div class="flex flex-col items-center w-1/2 px-1">
                                            <p class="font-bold text-gray-800 text-lg mb-1">£${item.price.toFixed(2)}</p>
                                            <p class="text-[11px] font-semibold text-gray-800 mb-2">Serves 1 <span class="font-normal text-gray-500">(250g)</span></p>
                                            <button onclick="addBuffetItem('${item.id}_s1', '${item.en} (Serves 1)', ${item.price}, '${imgSrc}')" class="w-full bg-[#3F7283] text-white py-1.5 rounded text-sm font-bold hover:bg-[#2c5361] transition-colors">
                                                Add
                                            </button>
                                        </div>
                                        
                                        <!-- Serves 2 Column -->
                                        <div class="flex flex-col items-center w-1/2 px-1">
                                            <p class="font-bold text-gray-800 text-lg mb-1">£${(item.price * 1.7).toFixed(2)}</p>
                                            <p class="text-[11px] font-semibold text-gray-800 mb-2">Serves 2 <span class="font-normal text-gray-500">(500g)</span></p>
                                            <button onclick="addBuffetItem('${item.id}_s2', '${item.en} (Serves 2)', ${item.price * 1.7}, '${imgSrc}')" class="w-full bg-[#3F7283] text-white py-1.5 rounded text-sm font-bold hover:bg-[#2c5361] transition-colors">
                                                Add
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            if (!hasResults && searchTerm) {
                html = `<div class="text-center py-12"><i class="fas fa-search text-4xl text-gray-300 mb-4"></i><h3 class="text-xl font-bold text-gray-700">No dishes found for "${searchTerm}"</h3><p class="text-gray-500 mt-2">Try adjusting your search or browsing the categories.</p></div>`;
            }

            container.innerHTML = html;
        }

        function confirmPackageSelection() {
            if (!currentPackage) return;
            const checkboxes = document.querySelectorAll('.pkg-item-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('Please select at least 1 item.');
                return;
            }
            let selectedOptions = [];
            checkboxes.forEach(cb => {
                selectedOptions.push(cb.getAttribute('data-enname'));
            });
            addToCart({
                id: currentPackage.id + '_' + Date.now(),
                name_th: currentPackage.name_th,
                name_en: currentPackage.name_en,
                price: currentPackage.price,
                unit_th: currentPackage.unit_th,
                unit_en: currentPackage.unit_en,
                qty: 1,
                img: currentPackage.img,
                category: 'Authentic', // Package items use 50% deposit
                options: selectedOptions
            });
            document.getElementById('package-modal').style.display = 'none';
            alert('Package added to cart successfully.');
        }

        function showQRCode(itemId, title, price) {
            const modal = document.getElementById('qr-modal');
            const container = document.getElementById('qrcode-container');
            const titleEl = document.getElementById('qr-item-title');
            const priceEl = document.getElementById('qr-item-price');

            // Clear previous QR
            container.innerHTML = '';
            
            // Generate URL with parameter
            const url = window.location.origin + window.location.pathname + '?add=' + itemId;

            // Generate new QR
            new QRCode(container, {
                text: url,
                width: 200,
                height: 200,
                colorDark : "#1B3022",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            titleEl.textContent = title;
            priceEl.textContent = "£" + price + " / Portion";
            
            modal.style.display = 'flex';
        }

        function addBuffetItem(id, name, price, img) {
            addToCart({
                id: id,
                name: { th: name, en: name },
                price: price,
                qty: 1,
                img: img,
                options: [] // no inner options for buffet dish
            });
            
            // Visual feedback
            const btn = document.querySelector(`#card-${id} button.bg-dark-green`);
            if(btn) {
                const oldHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> เพิ่มแล้ว';
                btn.classList.add('bg-gold', 'text-dark-green');
                setTimeout(() => {
                    btn.innerHTML = oldHtml;
                    btn.classList.remove('bg-gold', 'text-dark-green');
                }, 1500);
            }
        }

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const addItemId = urlParams.get('add');
            
            if (addItemId) {
                // Find item
                for (let cat of buffetData) {
                    const item = cat.items.find(i => i.id === addItemId);
                    if (item) {
                        const imgSrc = item.img === 'logo.png' ? 'logo.png' : (item.img.startsWith('http') ? item.img : `images/${item.img}`);
                        addBuffetItem(item.id, item.th, item.price, imgSrc);
                        
                        // Scroll to item
                        setTimeout(() => {
                            const el = document.getElementById('card-' + addItemId);
                            if(el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                el.style.boxShadow = '0 0 0 4px var(--gold)';
                                setTimeout(() => el.style.boxShadow = '', 2000);
                            }
                        }, 500);
                        
                        // Remove param from URL without reload
                        window.history.replaceState({}, document.title, window.location.pathname);
                        break;
                    }
                }
            }
        }

        
        function changeLang(lang, btn) {
            currentLang = lang;
            document.documentElement.lang = lang;
            
            // Update Buttons
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            // Re-render buffet menu
            renderBuffet();
        }
    
        document.addEventListener('DOMContentLoaded', loadBuffetMenu);
